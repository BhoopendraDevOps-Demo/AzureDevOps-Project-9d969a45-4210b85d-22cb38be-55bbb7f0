name: Terraform Pre-Prod

on:
  push:
    branches:
      - feature1

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Init Validate Plan Apply
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Check Azure Account
      - name: Check Azure Account
        run: |
          az account show
          az account list -o table

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Terraform Format Check
      # Runs from repository root so modules are also checked
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: ./environment/preprod
        run: terraform init

      # 7. Terraform Validate
      - name: Terraform Validate
        working-directory: ./environment/preprod
        run: terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        working-directory: ./environment/preprod
        run: terraform plan

      # 9. Terraform Apply
      - name: Terraform Apply
        working-directory: ./environment/preprod
        run: terraform apply -auto-approve